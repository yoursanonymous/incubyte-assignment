# Local/demo stack:  cp .env.example .env  (edit secrets)  &&  docker compose up --build
# First run also needs migrations:  docker compose run --rm migrate
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dealership
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dealership
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dealership -d dealership']
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ['127.0.0.1:5432:5432']

  migrate:
    build: { context: ., dockerfile: backend/Dockerfile, target: migrate }
    profiles: [tools]
    environment:
      DATABASE_URL: postgresql://dealership:${POSTGRES_PASSWORD}@db:5432/dealership
    depends_on: { db: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: backend/Dockerfile, target: runtime }
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://dealership:${POSTGRES_PASSWORD}@db:5432/dealership
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>= 32 chars) in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      TRUST_PROXY_HOPS: '1'
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: ['8080:8080']
    depends_on: [api]
    restart: unless-stopped

volumes:
  dbdata:
